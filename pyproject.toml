[project]
name = "smolvla-libero-baseline"
version = "0.1.0"
description = "Semantic controls for the SmolVLA action expert on LIBERO-Spatial"
requires-python = "==3.12.*"
dependencies = [
  "hf-libero==0.1.4",
  "lerobot[libero,smolvla,evaluation] @ git+https://github.com/huggingface/lerobot.git@8515d456be1dbef8c133f07188c785e683eca899",
  "mujoco==3.3.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "RUF100"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
